<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayTV Store — Apps para TV Box, Smart TV e mais</title>
  <meta name="description" content="Baixe apps para TV Box, Smart TV Android, iPhone, iPad e computador. PlayTV Extreme, XCIPTV, Smarters e muito mais." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="store">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand-area">
        <div class="brand-logo-wrap">
          <img src="logo.png" alt="PlayTV Store" class="brand-logo"
               onerror="this.style.display='none'; this.parentElement.classList.add('logo-fallback')">
        </div>
        <div>
          <h1 class="page-title">STORE APPS</h1>
          <p class="page-subtitle">Baixe apps para TV Box, Smart TV, celular, iPhone e computador.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="toggle-sound" class="top-link remote-focus" type="button" data-focusable>Som: ligado</button>
        <button id="btn-open-admin" class="top-link admin-entry-btn" type="button" title="Acesso Administrativo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          Admin
        </button>
      </div>
    </div>
  </header>

  <!-- STORE -->
  <main class="container simple-store" id="main">
    <div id="store-sections">
      <div class="store-loading">
        <div class="loading-spinner"></div>
        <p>Carregando apps…</p>
      </div>
    </div>
  </main>

  <!-- TEMPLATE CARD -->
  <template id="app-card-template">
    <article class="app-card">
      <div class="card-topline">
        <div class="thumb-box">
          <img class="app-thumb" src="" alt="" width="72" height="72" loading="lazy">
          <div class="thumb-fallback">APP</div>
        </div>
        <div class="device-icons"></div>
      </div>
      <div class="app-info">
        <h3 class="app-name"></h3>
        <p class="app-platform"></p>
        <p class="app-type"></p>
      </div>
      <div class="app-actions"></div>
    </article>
  </template>

  <!-- MODAL DE LOGIN -->
  <div id="login-modal" class="login-overlay" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" fill="none" width="32" height="32"><circle cx="12" cy="8" r="4" fill="currentColor" opacity=".9"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </div>
        <h2 id="login-title" class="login-title">Acesso Admin</h2>
        <p class="login-subtitle">PlayTV Store</p>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="login-field">
          <label for="login-user">Usuário</label>
          <input type="text" id="login-user" name="username" autocomplete="username"
                 placeholder="Digite o usuário" required />
        </div>
        <div class="login-field">
          <label for="login-pass">Senha</label>
          <div class="pass-wrap">
            <input type="password" id="login-pass" name="password" autocomplete="current-password"
                   placeholder="Digite a senha" required />
            <button type="button" id="toggle-pass" class="pass-toggle" title="Mostrar/ocultar senha" aria-label="Mostrar senha">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <label class="remember-label">
          <input type="checkbox" id="login-remember" name="remember" />
          <span class="remember-box"></span>
          Lembrar senha neste dispositivo
        </label>
        <div id="login-error" class="login-error" hidden></div>
        <button type="submit" id="login-submit" class="login-btn">
          <span id="login-btn-text">Entrar</span>
          <span id="login-spinner" class="btn-spinner" hidden></span>
        </button>
      </form>
      <button type="button" id="login-close" class="login-close" aria-label="Fechar">&times;</button>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
</body>
</html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-start:       #0d0919;
      --bg-mid:         #1a0d2e;
      --bg-end:         #0d1a2e;
      --accent-orange:  #ff7a18;
      --accent-pink:    #ff3d81;
      --accent-grad:    linear-gradient(90deg, #ff7a18, #ff3d81);
      --accent-grad-135:linear-gradient(135deg, #ff7a18, #ff3d81);
      --glass-bg:       rgba(255, 255, 255, 0.05);
      --glass-border:   rgba(255, 255, 255, 0.10);
      --text-primary:   #f0eaf8;
      --text-secondary: #9a8bb5;
      --text-muted:     #6b5d85;
      --card-radius:    18px;
      --transition:     0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }
    html { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; scroll-behavior: smooth; }
    body { min-height: 100vh; background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end)); background-attachment: fixed; color: var(--text-primary); overflow-x: hidden; }

    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.18; animation: orbFloat 12s ease-in-out infinite; }
    .bg-orb:nth-child(1) { width: 500px; height: 500px; background: radial-gradient(circle, #ff7a18, transparent); top: -150px; left: -100px; }
    .bg-orb:nth-child(2) { width: 600px; height: 600px; background: radial-gradient(circle, #ff3d81, transparent); top: 40%; right: -200px; animation-delay: -4s; }
    .bg-orb:nth-child(3) { width: 400px; height: 400px; background: radial-gradient(circle, #7b2fff, transparent); bottom: -100px; left: 30%; animation-delay: -8s; }
    @keyframes orbFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-40px) scale(1.08); } }

    #app { position: relative; z-index: 1; min-height: 100vh; padding-bottom: 50px; }
    
    .header { padding: 24px 32px 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; max-width: 1400px; margin: 0 auto; }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-icon { width: 48px; height: 48px; background: var(--accent-grad-135); border-radius: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(255, 122, 24, 0.45); }
    .logo-text { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
    .logo-text span.play { background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo-text span.tv { color: var(--text-primary); }
    .logo-subtitle { font-size: 0.7rem; font-weight: 500; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

    /* HERO */
    .hero { padding: 32px 32px 12px; text-align: center; }
    .hero h1 { font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 900; letter-spacing: -1px; line-height: 1.1; margin-bottom: 8px; text-transform: uppercase; }
    .hero h1 .gradient-text { background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--text-secondary); font-size: 1rem; font-weight: 400; max-width: 540px; margin: 0 auto; line-height: 1.5; }

    /* SECTIONS */
    .section-container { max-width: 1400px; margin: 0 auto; padding: 24px 32px 0; }
    .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 10px; }
    .section-title { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; color: var(--text-primary); }
    .section-title span.icon { font-size: 1.4rem; }
    .section-tag { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; padding: 3px 10px; border-radius: 50px; background: rgba(255, 122, 24, 0.15); color: var(--accent-orange); border: 1px solid rgba(255, 122, 24, 0.3); }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

    /* CARDS (SEM FOCO NO CARD INTEIRO) */
    .app-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--card-radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; backdrop-filter: blur(16px); position: relative; overflow: hidden; }

    .card-top { display: flex; align-items: flex-start; gap: 14px; }
    .app-icon-wrap { width: 64px; height: 64px; border-radius: 16px; overflow: hidden; flex-shrink: 0; background: linear-gradient(135deg, rgba(255,122,24,0.2), rgba(255,61,129,0.2)); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.08); }
    .app-icon-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .icon-fallback { font-size: 1.6rem; font-weight: 800; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; display: none; }

    .app-info { flex: 1; min-width: 0; }
    .app-name { font-size: 0.97rem; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .app-platform { font-size: 0.73rem; color: var(--text-secondary); font-weight: 500; }

    .card-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .badge { font-size: 0.63rem; font-weight: 700; text-transform: uppercase; padding: 3px 9px; border-radius: 50px; }
    .badge-type { background: rgba(255,122,24,0.12); color: var(--accent-orange); border: 1px solid rgba(255,122,24,0.25); }
    .badge-version { background: rgba(255,255,255,0.06); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); }

    .card-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }

    /* BOTÕES COM FOCO SUPER DESTACADO */
    .btn { display: block; width: 100%; padding: 12px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; text-align: center; text-decoration: none; cursor: pointer; border: 2px solid transparent; transition: all var(--transition); outline: none; position: relative; }
    
    .btn-primary { background: var(--accent-grad-135); color: #fff; box-shadow: 0 4px 16px rgba(255,122,24,0.35); }
    .btn-secondary { background: var(--glass-bg); color: var(--text-primary); border-color: var(--glass-border); }

    /* ESTADO SELECIONADO (D-PAD / HOVER) */
    .btn:hover, .btn.focused, .btn:focus-visible {
      transform: scale(1.06);
      z-index: 10;
      border-color: #ffffff !important;
      background: linear-gradient(90deg, #ff9d00, #ff0055) !important;
      color: #ffffff !important;
      box-shadow: 0 0 0 5px rgba(255, 122, 24, 0.7), 0 8px 30px rgba(255, 0, 85, 0.6) !important;
      animation: btnPulse 1.2s infinite alternate;
    }

    @keyframes btnPulse {
      0% { box-shadow: 0 0 0 5px rgba(255, 122, 24, 0.7), 0 8px 30px rgba(255, 0, 85, 0.6); }
      100% { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.9), 0 12px 40px rgba(255, 122, 24, 0.9); }
    }

    /* ESTADO QUANDO CLICA (CLICK / ENTER) */
    .btn.clicked {
      transform: scale(0.98) !important;
      background: linear-gradient(90deg, #00e676, #00b0ff) !important;
      border-color: #00e676 !important;
      color: #000000 !important;
      box-shadow: 0 0 0 6px rgba(0, 230, 118, 0.8), 0 0 30px rgba(0, 176, 255, 0.8) !important;
      animation: none !important;
    }

    .footer { text-align: center; padding: 36px 32px; color: var(--text-muted); font-size: 0.78rem; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 40px; }
    .footer strong { background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    @media (max-width: 640px) {
      .header { padding: 18px 16px 0; }
      .hero { padding: 20px 16px 8px; }
      .section-container { padding: 18px 16px 0; }
      .grid-container { gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    }
  </style>
</head>

  // ------------------------------------------------------------
  // FEEDBACK SONORO (AUDIO CONTEXT)
  // ------------------------------------------------------------
  let audioCtx = null;
  function beep(freq = 520, duration = 55, vol = 0.05) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
      osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + duration / 1000 + 0.05);
    } catch (_) {}
  }

  function playClickSound() {
    beep(880, 80, 0.08);
    setTimeout(() => beep(1200, 100, 0.08), 50);
  }

  // ------------------------------------------------------------
  // RENDER DE CARDS E SEÇÕES
  // ------------------------------------------------------------
  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function buildCardHTML(app) {
    const name = escapeHtml(app.name);
    const platform = escapeHtml(app.platform);
    const type = escapeHtml(app.type);
    const version = escapeHtml(app.version);
    const icon = escapeHtml(app.icon);
    const firstLetter = name.charAt(0).toUpperCase();

    const btnsHTML = app.buttons.map((b, idx) => `
      <a href="${escapeHtml(b.url)}" target="_blank" rel="noopener noreferrer"
         class="btn ${idx === 0 ? 'btn-primary' : 'btn-secondary'} focusable" tabindex="-1">
         ${escapeHtml(b.label)}
      </a>
    `).join('');

    return `
      <article class="app-card" role="article">
        <div class="card-top">
          <div class="app-icon-wrap">
            <img src="${icon}" alt="${name}" class="app-icon-img" loading="lazy" />
            <span class="icon-fallback">${firstLetter}</span>
          </div>
          <div class="app-info">
            <div class="app-name">${name}</div>
            <div class="app-platform">${platform}</div>
          </div>
        </div>
        <div class="card-badges">
          ${type ? `<span class="badge badge-type">${type}</span>` : ''}
          ${version ? `<span class="badge badge-version">${version}</span>` : ''}
        </div>
        <div class="card-buttons">
          ${btnsHTML}
        </div>
      </article>
    `;
  }

  function renderGrid(containerId, appsList) {
    const grid = document.getElementById(containerId);
    if (!grid) return;
    grid.innerHTML = appsList.map(app => buildCardHTML(app)).join('');

    grid.querySelectorAll('.app-icon-img').forEach(img => {
      img.addEventListener('error', e => {
        const wrap = e.target.closest('.app-icon-wrap');
        if (wrap) {
          e.target.style.display = 'none';
          const fallback = wrap.querySelector('.icon-fallback');
          if (fallback) fallback.style.display = 'flex';
        }
      }, { once: true });
    });
  }

  async function fetchFiveTvApps() {
    try {
      const res = await fetch('https://fivetv5.com/api/apps');
      if (!res.ok) return;
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        const existingNames = new Set(androidApps.map(a => a.name.toLowerCase()));
        data.forEach(item => {
          if (item.name && !existingNames.has(item.name.toLowerCase())) {
            androidApps.push({
              name: item.name,
              icon: item.icon || 'img/fivetv.png',
              platform: item.platform || 'Android TV / Box',
              version: item.version || 'APK',
              type: 'APK DOWNLOAD',
              buttons: [{ label: 'DOWNLOAD APK', url: item.file_url || `https://fivetv5.com/api/apps/${item.id}/file` }]
            });
          }
        });
        renderGrid('grid-android', androidApps);
        rebuildFocusables();
      }
    } catch (_) {}
  }

  // ------------------------------------------------------------
  // NAVEGAÇÃO CONTROLE REMOTO (FOCO SOMENTE NOS BOTÕES .btn)
  // ------------------------------------------------------------
  let focusIndex = 0;
  let focusables = [];

  function rebuildFocusables() {
    // Foco APENAS nos botões .btn / .focusable
    focusables = Array.from(document.querySelectorAll('.btn.focusable, .btn')).filter(el => {
      const rect = el.getBoundingClientRect();
      return el.offsetParent !== null || rect.width > 0 || rect.height > 0;
    });
    focusables = [...new Set(focusables)];
  }

  function indexOfFocusable(el) { return focusables.indexOf(el); }

  function applyFocus(idx, scrollIntoView = true) {
    if (focusables.length === 0) return;
    idx = Math.max(0, Math.min(idx, focusables.length - 1));

    focusables.forEach(el => { el.classList.remove('focused'); el.tabIndex = -1; });
    const target = focusables[idx];
    target.classList.add('focused');
    target.tabIndex = 0;
    focusIndex = idx;

    if (scrollIntoView) {
      target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    }
  }

  function findBestInDirection(direction) {
    if (focusables.length === 0) return -1;
    const current = focusables[focusIndex];
    if (!current) return 0;

    const cr = current.getBoundingClientRect();
    const cx = cr.left + cr.width / 2;
    const cy = cr.top + cr.height / 2;

    let bestIdx = -1;
    let bestScore = Infinity;

    focusables.forEach((el, i) => {
      if (i === focusIndex) return;
      const r = el.getBoundingClientRect();
      const ex = r.left + r.width / 2;
      const ey = r.top + r.height / 2;
      const dx = ex - cx;
      const dy = ey - cy;

      let inCone = false;
      let primaryDist = 0, crossDist = 0;

      switch (direction) {
        case 'right': inCone = dx > 4; primaryDist = dx; crossDist = Math.abs(dy); break;
        case 'left':  inCone = dx < -4; primaryDist = -dx; crossDist = Math.abs(dy); break;
        case 'down':  inCone = dy > 4; primaryDist = dy; crossDist = Math.abs(dx); break;
        case 'up':    inCone = dy < -4; primaryDist = -dy; crossDist = Math.abs(dx); break;
      }

      if (!inCone) return;
      const score = primaryDist + crossDist * 3.5;
      if (score < bestScore) { bestScore = score; bestIdx = i; }
    });

    return bestIdx;
  }

  function triggerButtonClick(btnElement) {
    if (!btnElement) return;
    playClickSound();
    btnElement.classList.add('clicked');
    setTimeout(() => {
      btnElement.classList.remove('clicked');
    }, 350);
  }

  document.addEventListener('keydown', (e) => {
    let handled = false;
    switch (e.key) {
      case 'ArrowRight': { const idx = findBestInDirection('right'); if (idx >= 0) { applyFocus(idx); beep(500, 45, 0.035); } handled = true; break; }
      case 'ArrowLeft':  { const idx = findBestInDirection('left');  if (idx >= 0) { applyFocus(idx); beep(500, 45, 0.035); } handled = true; break; }
      case 'ArrowDown':  { const idx = findBestInDirection('down');  if (idx >= 0) { applyFocus(idx); beep(500, 45, 0.035); } handled = true; break; }
      case 'ArrowUp':    { const idx = findBestInDirection('up');    if (idx >= 0) { applyFocus(idx); beep(500, 45, 0.035); } handled = true; break; }
      case 'Enter':
      case ' ': {
        const focused = focusables[focusIndex];
        if (focused) {
          triggerButtonClick(focused);
          setTimeout(() => {
            focused.click();
          }, 150);
        }
        handled = e.key === ' ';
        break;
      }
    }
    if (handled) e.preventDefault();
  });

  document.addEventListener('click', (e) => {
    const target = e.target.closest('.btn');
    if (!target) return;
    rebuildFocusables();
    const idx = indexOfFocusable(target);
    if (idx >= 0) {
      applyFocus(idx, false);
      triggerButtonClick(target);
    }
  });

  document.addEventListener('focusin', (e) => {
    const idx = indexOfFocusable(e.target);
    if (idx >= 0) focusIndex = idx;
  });

  function init() {
    renderGrid('grid-android', androidApps);
    renderGrid('grid-pc', pcApps);
    renderGrid('grid-ios', iosApps);
    
    rebuildFocusables();
    if (focusables.length > 0) {
      applyFocus(0, false);
    }

    fetchFiveTvApps();
  }

  init();
</script>
</body>
</html>

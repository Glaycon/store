      osc.connect(gain); gain.connect(audioCtx.destination);

      gain.gain.setValueAtTime(vol, audioCtx.currentTime);

          if (fallback) fallback.style.display = 'flex';
        }
      }, { once: true });
    });

    rebuildFocusables();

    const firstCard = appsGrid.querySelector('.app-card');
    if (firstCard) {
      focusIndex = indexOfFocusable(firstCard);
      if (focusIndex < 0) focusIndex = 0;
      applyFocus(focusIndex, false);
    }
  }

  function buildCardHTML(app, i) {
    const name = escapeHtml(app.name);
    const platform = escapeHtml(app.platform);
    const type = escapeHtml(app.type);
    const version = escapeHtml(app.version);
    const icon = escapeHtml(app.icon);
    const firstLetter = name.charAt(0).toUpperCase();

    const btnsHTML = app.buttons.map((b, idx) => `
      <a href="${escapeHtml(b.url)}" target="_blank" rel="noopener noreferrer"
         class="btn ${idx === 0 ? 'btn-primary' : 'btn-secondary'} focusable" tabindex="-1">
         ${escapeHtml(b.label)}
      </a>
    `).join('');

    return `
      <article class="app-card focusable" tabindex="-1" role="article" data-card-index="${i}">
        <div class="card-top">
          <div class="app-icon-wrap">
            <img src="${icon}" alt="${name}" class="app-icon-img" loading="lazy" />
            <span class="icon-fallback">${firstLetter}</span>
          </div>
          <div class="app-info">
            <div class="app-name">${name}</div>
            <div class="app-platform">${platform}</div>
          </div>
        </div>
        <div class="card-badges">
          ${type ? `<span class="badge badge-type">${type}</span>` : ''}
          ${version ? `<span class="badge badge-version">${version}</span>` : ''}
        </div>
        <div class="card-buttons">
          ${btnsHTML}
        </div>
      </article>
    `;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function activateTab(cat) {
    tabButtons.forEach(btn => {
      const isActive = btn.dataset.cat === cat;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
      btn.tabIndex = isActive ? 0 : -1;
    });
    renderApps(cat);
  }

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      beep(440, 50, 0.03);
      activateTab(btn.dataset.cat);
    });
  });

  function rebuildFocusables() {
    focusables = Array.from(document.querySelectorAll('.tab, .app-card, .btn, .focusable')).filter(el => {
      const rect = el.getBoundingClientRect();
      return el.offsetParent !== null || rect.width > 0 || rect.height > 0;
    });
    focusables = [...new Set(focusables)];
  }

  function indexOfFocusable(el) { return focusables.indexOf(el); }

  function applyFocus(idx, scrollIntoView = true) {
    if (focusables.length === 0) return;
    idx = Math.max(0, Math.min(idx, focusables.length - 1));

    focusables.forEach(el => { el.classList.remove('focused'); el.tabIndex = -1; });
    const target = focusables[idx];
    target.classList.add('focused');
    target.tabIndex = 0;
    focusIndex = idx;

    if (scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
  }

  function findBestInDirection(direction) {
    if (focusables.length === 0) return -1;
    const current = focusables[focusIndex];
    if (!current) return 0;

    const cr = current.getBoundingClientRect();
    const cx = cr.left + cr.width / 2;
    const cy = cr.top + cr.height / 2;

    let bestIdx = -1;
    let bestScore = Infinity;

    focusables.forEach((el, i) => {
      if (i === focusIndex) return;
      const r = el.getBoundingClientRect();
      const ex = r.left + r.width / 2;
      const ey = r.top + r.height / 2;
      const dx = ex - cx;
      const dy = ey - cy;

      let inCone = false;
      let primaryDist = 0, crossDist = 0;

      switch (direction) {
        case 'right': inCone = dx > 4; primaryDist = dx; crossDist = Math.abs(dy); break;
        case 'left':  inCone = dx < -4; primaryDist = -dx; crossDist = Math.abs(dy); break;
        case 'down':  inCone = dy > 4; primaryDist = dy; crossDist = Math.abs(dx); break;
        case 'up':    inCone = dy < -4; primaryDist = -dy; crossDist = Math.abs(dx); break;
      }

      if (!inCone) return;
      const score = primaryDist + crossDist * 3.5;
      if (score < bestScore) { bestScore = score; bestIdx = i; }
    });

    return bestIdx;
  }

  document.addEventListener('keydown', (e) => {
    let handled = false;
    switch (e.key) {
      case 'ArrowRight': { const idx = findBestInDirection('right'); if (idx >= 0) { applyFocus(idx); beep(500, 50, 0.035); } handled = true; break; }
      case 'ArrowLeft':  { const idx = findBestInDirection('left');  if (idx >= 0) { applyFocus(idx); beep(500, 50, 0.035); } handled = true; break; }
      case 'ArrowDown':  { const idx = findBestInDirection('down');  if (idx >= 0) { applyFocus(idx); beep(500, 50, 0.035); } handled = true; break; }
      case 'ArrowUp':    { const idx = findBestInDirection('up');    if (idx >= 0) { applyFocus(idx); beep(500, 50, 0.035); } handled = true; break; }
      case 'Enter':
      case ' ': {
        const focused = focusables[focusIndex];
        if (focused) { beep(620, 70, 0.05); focused.click(); }
        handled = e.key === ' ';
        break;
      }
    }
    if (handled) e.preventDefault();
  });

  document.addEventListener('click', (e) => {
    const target = e.target.closest('.focusable, .tab, .btn');
    if (!target) return;
    rebuildFocusables();
    const idx = indexOfFocusable(target);
    if (idx >= 0) applyFocus(idx, false);
  });

  document.addEventListener('focusin', (e) => {
    const idx = indexOfFocusable(e.target);
    if (idx >= 0) focusIndex = idx;
  });

  function init() {
    totalAppsCount.textContent = allApps.length;
    renderApps('all');
  }

  init();
</script>
</body>
</html>
